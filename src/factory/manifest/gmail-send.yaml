# Outbound mail, split off from gmail.yaml so it can be its own TOOL.
#
# Everything that makes mail leave the account lives here and nowhere else, so outbound
# mail is one tool to gate, audit or switch off.
#
# Sends go out without a per-call approval prompt, the same as the claude.ai Gmail
# connector: Claude Code can only show that prompt in the desktop app, not on a phone
# over Remote Control. To require a person's approval on every send again (in every
# permission mode, bypassPermissions included), add `requires_user_interaction: true`
# below; bulk_operations then refuses this tool too, since only the outer call would be
# prompted.
#
# It is still the gmail SERVICE (parent_service): gmailPatch handles these operations and
# gmail's scopes authorize them, so per-account read-only access and every
# GWS_SAFETY_POLICY (draft-only-email included) apply exactly as before the split.
tool_name: send_email
description: "Send mail from a Gmail account: a new message, a reply, a reply-all, or a forward. It sends immediately, so call it only for a message the user asked for, with the complete final text. `email` is the account the message is sent FROM. To prepare mail for the user to review first, use manage_email createDraft, then sendDraft here once they approve it."
requires_email: true
google_service: gmail
parent_service: gmail
explicit_account: true
operations:

  send:
    type: action
    description: "compose and send a new email (attachments up to 25 MB via the upload endpoint)"
    params:
      to:
        type: string
        description: "Recipient email(s), comma-separated"
        required: true
      subject:
        type: string
        description: "Email subject line"
        required: true
      body:
        type: string
        description: "Email body text. On `forward`, an optional note prepended ABOVE the forwarded message."
        required: true
      from:
        type: string
        description: "Sender email or RFC 2822 mailbox for a verified Gmail Send As alias"
      cc:
        type: string
        description: "CC email(s), comma-separated. On `replyAll` these are ADDITIONAL — they do not replace the recipients already on the thread."
      bcc:
        type: string
        description: "BCC email(s), comma-separated"
      attachments:
        type: string
        description: "Workspace filenames to attach, comma-separated (files must exist in workspace via manage_workspace)."
      html:
        type: boolean
        description: "Treat body as HTML content (default: plain text)"

  reply:
    type: action
    description: "reply to a message (thread-aware)"
    params:
      messageId:
        type: string
        description: "Email message ID"
        required: true
      body:
        type: string
        description: "Email body text. On `forward`, an optional note prepended ABOVE the forwarded message."
        required: true
      attachments:
        type: string
        description: "Workspace filenames to attach, comma-separated (files must exist in workspace via manage_workspace)."
      html:
        type: boolean
        description: "Treat body as HTML content (default: plain text)"

  replyAll:
    type: action
    description: "reply-all to a message (thread-aware, includes all recipients)"
    params:
      messageId:
        type: string
        description: "Email message ID"
        required: true
      body:
        type: string
        description: "Email body text. On `forward`, an optional note prepended ABOVE the forwarded message."
        required: true
      cc:
        type: string
        description: "CC email(s), comma-separated. On `replyAll` these are ADDITIONAL — they do not replace the recipients already on the thread."
      attachments:
        type: string
        description: "Workspace filenames to attach, comma-separated (files must exist in workspace via manage_workspace)."
      html:
        type: boolean
        description: "Treat body as HTML content (default: plain text)"

  forward:
    type: action
    description: "forward a message to new recipients (includes original attachments by default)"
    params:
      messageId:
        type: string
        description: "Email message ID"
        required: true
      to:
        type: string
        description: "Recipient email(s), comma-separated"
        required: true
      body:
        type: string
        description: "Email body text. On `forward`, an optional note prepended ABOVE the forwarded message."

  sendDraft:
    type: action
    description: "send a saved draft exactly as it is, by its draft id (the r… id from manage_email listDrafts or createDraft). Use this after the user has reviewed a draft, so what goes out is what they read."
    resource: users.drafts.send
    params:
      draftId:
        type: string
        description: "Draft id (the r… id from listDrafts or createDraft), not a message id"
        required: true
        maps_to: id
    defaults:
      userId: me
